<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Silima</title>

    <link rel="stylesheet" href="controller.css">
    <link rel="icon" href="silima.ico">
    <script src="controller.js" defer></script>
</head>

<body>

<main class="controller">

    <section class="connection-status" aria-live="polite">
        <div>
            <span id="status-light"></span>
            <span id="status-text">Connecting...</span>
        </div>
        <div class="server-address">
            Server: <span id="server-address">Unknown</span>
        </div>
    </section>

    <!-- Shoulder buttons -->
    <div class="shoulders">
        <button class="shoulder" data-input="l">L</button>
        <button class="shoulder" data-input="r">R</button>
    </div>


    <!-- D-Pad -->
    <section class="dpad" aria-label="Directional pad">
        <button class="dpad-button up" data-input="up">▲</button>
        <button class="dpad-button left" data-input="left">◀</button>
        <div class="dpad-center"></div>
        <button class="dpad-button right" data-input="right">▶</button>
        <button class="dpad-button down" data-input="down">▼</button>
    </section>


    <!-- Start / Select -->
    <section class="menu-buttons">
        <div>
            <button class="menu-button" data-input="select"></button>
            <span>SELECT</span>
        </div>

        <div>
            <button class="menu-button" data-input="start"></button>
            <span>START</span>
        </div>
    </section>


    <!-- ABXY -->
    <section class="face-buttons" aria-label="Face buttons">
        <button class="face-button x" data-input="x">X</button>
        <button class="face-button y" data-input="y">Y</button>
        <button class="face-button a" data-input="a">A</button>
        <button class="face-button b" data-input="b">B</button>
    </section>

</main>

</body>
</html>
