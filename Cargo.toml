[package]
name = "Silima"
version = "0.1.3"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
local-ip-address = "0.6.13"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["fs"] }
webbrowser = "1.2.4"

[build-dependencies]
hex = "0.4.3"
sha2 = "0.11.0"
serde_json = "1"
