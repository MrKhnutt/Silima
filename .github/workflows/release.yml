name: Silima Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  
  documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Generate release information
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          printf 'Version: %s\nCommit: %s\nBuild date: %s\n' \
            "$RELEASE_VERSION" \
            "$RELEASE_COMMIT" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > documentation/RELEASEINFO

      - name: Build security documentation
        run: make security-distributable

      - name: Upload security documentation
        uses: actions/upload-artifact@v5
        with:
          name: silima-security-documentation
          path: Silima-Information-Security-Reference.pdf
          if-no-files-found: error
  
  build:
    needs: documentation
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: silima-windows-x64
          - os: ubuntu-latest
            artifact: silima-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      
      - name: Download security documentation
        uses: actions/download-artifact@v8
        with:
          name: silima-security-documentation
          path: .

      - name: Build release
        run: cargo build --release --verbose

      # ---------------- Windows ----------------

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package

          Copy-Item target/release/silima.exe package/

          if (Test-Path config.yaml) {
            Copy-Item config.yaml package/
          }

          if (Test-Path static) {
            Copy-Item static package/static -Recurse
          }

          if (Test-Path media) {
            Copy-Item media package/media -Recurse
          }

          if (Test-Path frontend) {
            Copy-Item media package/frontend -Recurse
          }

          if (Test-Path README.md) {
            Copy-Item README.md package/
          }
          if (Test-Path README.md) {
            Copy-Item SECURITY.md package/
          }
          if (Test-Path README.md) {
            Copy-Item LICENSE.md package/
          }
          Copy-Item Silima-Information-Security-Reference.pdf package/
          
          Compress-Archive `
            -Path package/* `
            -DestinationPath silima-windows-x64.zip

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: silima-windows-x64
          path: silima-windows-x64.zip

      # ---------------- Linux ----------------

      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir package

          cp target/release/silima package/

          [ -f config.yaml ] && cp config.yaml package/
          [ -d static ] && cp -r static package/
          [ -d media ] && cp -r media package/
          [ -d frontend ] && cp -r frontend package/
          [ -f README.md ] && cp README.md package/
          [ -f SECURITY.md ] && cp SECURITY.md package/
          [ -f LICENSE ] && cp LICENSE package/

          cp Silima-Information-Security-Reference.pdf package/

          tar -czf silima-linux-x64.tar.gz -C package .

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: silima-linux-x64
          path: silima-linux-x64.tar.gz


  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/* \
            --title "Silima ${{ github.ref_name }}" \
            --generate-notes
